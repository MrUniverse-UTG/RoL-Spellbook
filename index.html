<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Realms of Legacy — Studies of Sorcery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --void:      #04060f;
  --deep:      #080d1c;
  --mid:       #0d1630;
  --surface:   #0f1528;
  --border:    rgba(100,160,255,0.13);
  --cyan:      #4fc3f7;
  --cyan-glow: rgba(79,195,247,0.35);
  --gold:      #c9a84c;
  --gold-pale: #e8d5a3;
  --text:      #c8d8f0;
  --text-dim:  #7a90b8;
  --white:     #eef2ff;
}

html { scroll-behavior: smooth; }

body {
  background-color: var(--void);
  color: var(--text);
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1.05rem;
  line-height: 1.75;
  overflow-x: hidden;
  min-height: 100vh;
  min-height: calc(var(--vh,1vh)*100);
}

#starfield {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 1060px;
  margin: 0 auto;
  padding: 0 max(1.5rem, env(safe-area-inset-left)) calc(5rem + env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-right));
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ── Hero ── */
.hero {
  text-align: center;
  padding: 7rem 1rem 4rem;
}

.hero-eyebrow {
  font-family: 'Cinzel', serif;
  font-size: .72rem;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: var(--cyan);
  margin-bottom: 1.4rem;
  opacity: 0;
  animation: fadeUp .8s .2s ease forwards;
}

.hero-title {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(2.2rem, 6vw, 4.4rem);
  font-weight: 700;
  line-height: 1.1;
  color: var(--white);
  margin-bottom: .4rem;
  opacity: 0;
  animation: fadeUp .9s .4s ease forwards;
}
.hero-title span { color: var(--gold); }

.hero-subtitle {
  font-family: 'Cinzel', serif;
  font-size: clamp(.75rem, 1.8vw, .95rem);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 2rem;
  opacity: 0;
  animation: fadeUp .9s .55s ease forwards;
}

.hero-divider {
  width: 120px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 2rem;
  opacity: 0;
  animation: fadeIn .8s .7s ease forwards;
}

.hero-lore {
  font-style: italic;
  color: var(--text-dim);
  max-width: 620px;
  margin: 0 auto 3rem;
  font-size: 1.05rem;
  opacity: 0;
  animation: fadeUp .9s .85s ease forwards;
}

/* ── Search ── */
.search-wrap {
  max-width: 580px;
  margin: 0 auto 3.5rem;
  position: relative;
  opacity: 0;
  animation: fadeUp .8s 1s ease forwards;
}

.search-icon {
  position: absolute;
  left: 1.1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--cyan);
  opacity: .5;
  font-size: 1rem;
  pointer-events: none;
  transition: opacity .2s;
}

#search {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(79,195,247,0.22);
  border-radius: 3px;
  padding: .85rem 1.2rem .85rem 2.9rem;
  min-height: 48px;
  color: var(--text);
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1rem;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
  letter-spacing: .02em;
}
#search::placeholder { color: var(--text-dim); opacity: .7; }
#search:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 3px rgba(79,195,247,0.08), 0 0 20px rgba(79,195,247,0.1);
  background: rgba(255,255,255,0.06);
}

#results {
  position: absolute;
  top: calc(100% + .4rem);
  left: 0; right: 0;
  background: #080d1c;
  border: 1px solid rgba(79,195,247,0.18);
  border-radius: 3px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.03);
  z-index: 100;
  display: none;
  max-height: min(400px,50vh);
  overflow-y: auto;
}
#results::-webkit-scrollbar { width: 3px; }
#results::-webkit-scrollbar-thumb { background: rgba(79,195,247,.2); border-radius: 2px; }

.result-section-header {
  padding: .45rem 1.1rem .2rem;
  font-family: 'Cinzel', serif;
  font-size: .62rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--text-dim);
  opacity: .6;
  border-top: 1px solid rgba(100,160,255,.07);
}
.result-section-header:first-child { border-top: none; }

.result-item {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .65rem 1.1rem;
  min-height: 48px;
  cursor: pointer;
  text-decoration: none;
  color: var(--text);
  transition: background .15s;
  border-bottom: 1px solid rgba(255,255,255,.03);
}
.result-item:last-child { border-bottom: none; }
.result-item:hover, .result-item:focus { background: rgba(79,195,247,.06); outline: none; }

.ri-icon { font-size: 1rem; flex-shrink: 0; }
.ri-name { font-size: 1rem; flex: 1; }
.ri-name mark { background: none; color: var(--gold-pale); font-style: normal; }
.ri-meta { font-size: .82rem; color: var(--text-dim); opacity: .7; white-space: nowrap; }
.ri-rank {
  font-size: .65rem;
  padding: .1rem .38rem;
  border-radius: 2px;
  font-family: 'Cinzel', serif;
  color: #fff;
  opacity: .85;
  white-space: nowrap;
  flex-shrink: 0;
}

.result-study-row {
  display: flex;
  align-items: center;
  gap: .75rem;
  padding: .65rem 1.1rem;
  min-height: 48px;
  text-decoration: none;
  color: var(--text);
  transition: background .15s;
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.result-study-row:hover { background: rgba(79,195,247,.06); }
.rs-icon { font-size: 1.2rem; }
.rs-name { font-size: 1rem; flex: 1; }
.rs-name mark { background: none; color: var(--gold-pale); font-style: normal; }
.rs-count { font-size: .82rem; color: var(--text-dim); opacity: .6; }

.no-results {
  padding: 1.25rem;
  text-align: center;
  font-style: italic;
  font-size: .95rem;
  color: var(--text-dim);
  opacity: .6;
}

/* ── Section label ── */
.section-label {
  font-family: 'Cinzel', serif;
  font-size: .65rem;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
  margin-bottom: 1.4rem;
  opacity: 0;
  animation: fadeIn .8s 1.1s ease forwards;
}

/* ── Study cards ── */
.studies-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  opacity: 0;
  animation: fadeUp .8s 1.15s ease forwards;
}

.study-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: .4rem;
  padding: 1.4rem 1.3rem;
  background: var(--surface);
  text-decoration: none;
  color: var(--text);
  position: relative;
  overflow: hidden;
  transition: background .2s;
  cursor: pointer;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.study-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 20% 0%, var(--sc-glow) 0%, transparent 65%);
  opacity: 0;
  transition: opacity .3s;
}

.study-card:hover { background: var(--mid); }
.study-card:hover::before { opacity: 1; }

.sc-icon {
  font-size: 1.6rem;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 0 6px var(--sc-color));
  transition: transform .25s;
}
.study-card:hover .sc-icon { transform: scale(1.12); }

.sc-name {
  font-family: 'Cinzel', serif;
  font-size: .9rem;
  font-weight: 600;
  color: var(--sc-color);
  position: relative;
  z-index: 1;
  letter-spacing: .06em;
}

.sc-desc {
  font-size: .88rem;
  color: var(--text-dim);
  line-height: 1.5;
  position: relative;
  z-index: 1;
  font-style: italic;
}

.sc-count {
  font-family: 'Cinzel', serif;
  font-size: .6rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--sc-color);
  opacity: .45;
  position: relative;
  z-index: 1;
  margin-top: auto;
  padding-top: .35rem;
}

.sc-arrow {
  position: absolute;
  bottom: 1rem;
  right: 1rem;
  color: var(--cyan);
  opacity: 0;
  font-size: .85rem;
  transition: opacity .2s, transform .2s;
  z-index: 1;
}
.study-card:hover .sc-arrow { opacity: .45; transform: translateX(3px); }

/* ── Footer ── */
footer {
  text-align: center;
  margin-top: 4rem;
  padding: 1.5rem 0 calc(1.5rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  font-family: 'Cinzel', serif;
  font-size: .62rem;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--text-dim);
  opacity: .3;
}

@media (max-width: 600px) {
  .hero { padding: 5rem .75rem 2.5rem; }
  .studies-grid { grid-template-columns: 1fr 1fr; }
  .wrap { padding: 0 1rem calc(4rem + env(safe-area-inset-bottom)); }
  .search-wrap { margin-bottom: 2rem; }
}
@media (max-width: 380px) {
  .studies-grid { grid-template-columns: 1fr; }
  .hero-title { font-size: 1.8rem; }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="wrap">
  <header class="hero">
    <p class="hero-eyebrow">Player Codex</p>
    <h1 class="hero-title">Realms of <span>Legacy</span></h1>
    <p class="hero-subtitle">Studies of Sorcery</p>
    <div class="hero-divider"></div>
    <p class="hero-lore">Twelve paths of arcane mastery. Each Study grants dominion over a fundamental force — choose your discipline and bend reality to your will.</p>
  </header>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search spells or studies…" autocomplete="off" spellcheck="false">
    <span class="search-icon">⚲</span>
    <div id="results"></div>
  </div>

  <p class="section-label">Choose your Study</p>
  <div class="studies-grid" id="studies-grid"></div>

  <footer>Realms of Legacy &mdash; Player Codex &mdash; Studies of Sorcery</footer>
</div>

<script>
function setVh() {
  document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
}
setVh();
window.addEventListener('resize', setVh, { passive: true });

// ── Starfield ────────────────────────────────────────────────────────────────
(function() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let W, H, stars;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makeStars(n) {
    return Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.1 + 0.15,
      speed: Math.random() * 0.0004 + 0.0001,
      phase: Math.random() * Math.PI * 2,
    }));
  }

  resize();
  stars = makeStars(260);
  window.addEventListener('resize', () => { resize(); stars = makeStars(260); }, { passive: true });

  let t = 0;
  function frame() {
    ctx.clearRect(0, 0, W, H);
    t += 16;
    stars.forEach(s => {
      const alpha = 0.2 + 0.55 * (0.5 + 0.5 * Math.sin(s.phase + t * s.speed));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,220,255,${alpha.toFixed(2)})`;
      ctx.fill();
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

// ── Build study cards ────────────────────────────────────────────────────────
const STUDIES = [
  { name:"Aeromancy",    icon:"⚡", color:"#29b6f6", glow:"rgba(41,182,246,0.15)",   file:"aeromancy.html",    desc:"Air and lightning — speed, control, and devastating blasts." },
  { name:"Blood",        icon:"🩸", color:"#e53935", glow:"rgba(229,57,53,0.15)",    file:"blood.html",        desc:"Manipulate body and mind through the blood that flows within." },
  { name:"Contagion",    icon:"☣",  color:"#7cb342", glow:"rgba(124,179,66,0.15)",   file:"contagion.html",    desc:"Inflict devastating diseases and toxic conditions on foes." },
  { name:"Cryomancy",    icon:"❄",  color:"#4fc3f7", glow:"rgba(79,195,247,0.15)",   file:"cryomancy.html",    desc:"Freeze, shatter, and encase your enemies in endless winter." },
  { name:"Death",        icon:"☠",  color:"#9575cd", glow:"rgba(149,117,205,0.15)",  file:"death.html",        desc:"Raise the fallen and drain the living with death's power." },
  { name:"Displacement", icon:"◎",  color:"#7c4dff", glow:"rgba(124,77,255,0.15)",   file:"displacement.html", desc:"Teleportation and spatial mastery to reposition and confound." },
  { name:"Divinity",     icon:"✦",  color:"#fdd835", glow:"rgba(253,216,53,0.15)",   file:"divinity.html",     desc:"Call upon divine blessing to smite enemies and shield allies." },
  { name:"Geomancy",     icon:"⛰",  color:"#a1887f", glow:"rgba(161,136,127,0.15)",  file:"geomancy.html",     desc:"Command earth and stone to crush, summon, and reshape terrain." },
  { name:"Illusion",     icon:"◈",  color:"#e040fb", glow:"rgba(224,64,251,0.15)",   file:"illusion.html",     desc:"Bend light and perception to deceive, disguise, and vanish." },
  { name:"Pyromancy",    icon:"🔥", color:"#ff5722", glow:"rgba(255,87,34,0.15)",    file:"pyromancy.html",    desc:"Overwhelming offense — the best defense is pure fire." },
  { name:"Recovery",     icon:"✚",  color:"#43a047", glow:"rgba(67,160,71,0.15)",    file:"recovery.html",     desc:"Master medic and support: heal wounds and mend broken bodies." },
  { name:"Shadows",      icon:"◼",  color:"#78909c", glow:"rgba(120,144,156,0.15)",  file:"shadows.html",      desc:"Bend dark energies to infiltrate and incapacitate the weak." },
];

const grid = document.getElementById('studies-grid');
STUDIES.forEach(s => {
  const a = document.createElement('a');
  a.href = s.file;
  a.className = 'study-card';
  a.style.setProperty('--sc-color', s.color);
  a.style.setProperty('--sc-glow', s.glow);
  a.innerHTML = `
    <span class="sc-icon">${s.icon}</span>
    <span class="sc-name">${s.name}</span>
    <span class="sc-desc">${s.desc}</span>
    <span class="sc-count">12 Spells</span>
    <span class="sc-arrow">→</span>
  `;
  grid.appendChild(a);
});

// ── Search ───────────────────────────────────────────────────────────────────
let spellIndex = [];
fetch('spells_index.json').then(r => r.json()).then(d => { spellIndex = d; });

const searchEl   = document.getElementById('search');
const resultsEl  = document.getElementById('results');
const searchWrap = document.querySelector('.search-wrap');
const RANK_COLORS = ["#9e9e9e","#4fc3f7","#81c784","#ffb74d","#f06292","#ce93d8"];

function highlight(text, query) {
  if (!query) return text;
  return text.replace(new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi'), '<mark>$1</mark>');
}
function openResults()  { resultsEl.style.display = 'block'; positionDropdown(); }
function closeResults() { resultsEl.style.display = 'none'; }

function showResults(query) {
  if (!query.trim()) { closeResults(); return; }
  const q = query.toLowerCase().trim();
  const studyMatches = STUDIES.filter(s => s.name.toLowerCase().includes(q));
  const spellMatches = spellIndex.filter(s => s.name.toLowerCase().includes(q) || s.study.toLowerCase().includes(q)).slice(0, 12);
  if (!studyMatches.length && !spellMatches.length) {
    resultsEl.innerHTML = '<div class="no-results">No spells or studies found</div>';
    openResults(); return;
  }
  let html = '';
  if (studyMatches.length) {
    html += '<div class="result-section-header">Studies</div>';
    studyMatches.forEach(s => {
      html += `<a class="result-study-row" href="${s.file}"><span class="rs-icon">${s.icon}</span><span class="rs-name" style="color:${s.color}">${highlight(s.name, query)}</span><span class="rs-count">12 spells →</span></a>`;
    });
  }
  if (spellMatches.length) {
    html += '<div class="result-section-header">Spells</div>';
    spellMatches.forEach(sp => {
      const rc = RANK_COLORS[sp.rank] || RANK_COLORS[RANK_COLORS.length-1];
      html += `<a class="result-item" href="${sp.file}#${sp.slug}"><span class="ri-icon">${sp.icon}</span><span class="ri-name">${highlight(sp.name, query)}</span><span class="ri-meta" style="color:${sp.color}">${sp.study}</span><span class="ri-rank" style="background:${rc}">Rank ${sp.rank}</span></a>`;
    });
  }
  resultsEl.innerHTML = html;
  openResults();
}

function positionDropdown() {
  if (!window.visualViewport) return;
  const vv = window.visualViewport;
  const rect = searchWrap.getBoundingClientRect();
  const spaceBelow = vv.height - (rect.bottom - vv.offsetTop);
  const spaceAbove = rect.top - vv.offsetTop;
  resultsEl.style.maxHeight = Math.max(spaceBelow - 16, 120) + 'px';
  if (spaceBelow < 200 && spaceAbove > spaceBelow) {
    resultsEl.style.top = 'auto'; resultsEl.style.bottom = 'calc(100% + .4rem)';
  } else {
    resultsEl.style.top = 'calc(100% + .4rem)'; resultsEl.style.bottom = 'auto';
  }
}

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => { setVh(); if (resultsEl.style.display==='block') positionDropdown(); }, {passive:true});
  window.visualViewport.addEventListener('scroll', () => { if (resultsEl.style.display==='block') positionDropdown(); }, {passive:true});
}

searchEl.addEventListener('focus', () => {
  if (searchEl.value) showResults(searchEl.value);
  setTimeout(() => { searchWrap.scrollIntoView({behavior:'smooth',block:'center'}); positionDropdown(); }, 320);
});
searchEl.addEventListener('input', e => showResults(e.target.value));
searchEl.addEventListener('keydown', e => {
  const items = resultsEl.querySelectorAll('a');
  if (!items.length) return;
  if (e.key==='ArrowDown') { e.preventDefault(); items[0].focus(); }
  if (e.key==='Escape') { closeResults(); searchEl.blur(); }
  if (e.key==='Enter' && items.length) items[0].click();
});
resultsEl.addEventListener('keydown', e => {
  const items = [...resultsEl.querySelectorAll('a')];
  const idx = items.indexOf(document.activeElement);
  if (e.key==='ArrowDown') { e.preventDefault(); items[Math.min(idx+1,items.length-1)].focus(); }
  if (e.key==='ArrowUp')   { e.preventDefault(); idx>0 ? items[idx-1].focus() : searchEl.focus(); }
  if (e.key==='Escape')    { closeResults(); searchEl.focus(); }
});
document.addEventListener('touchstart', e => { if (!e.target.closest('.search-wrap')) closeResults(); }, {passive:true});
document.addEventListener('click',      e => { if (!e.target.closest('.search-wrap')) closeResults(); });
window.addEventListener('scroll', () => { if (document.activeElement !== searchEl) closeResults(); }, {passive:true});
</script>
</body>
</html>
